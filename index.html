            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 邪能绿动态背景 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, #0a2f1a, #030a05, #010302);
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(80, 200, 60, 0.02) 0px, rgba(80, 200, 60, 0.02) 2px, transparent 2px, transparent 12px),
                        repeating-linear-gradient(90deg, rgba(80, 200, 60, 0.02) 0px, rgba(80, 200, 60, 0.02) 2px, transparent 2px, transparent 12px);
            pointer-events: none;
            z-index: -1;
        }

        /* 主卡片 - 整个截图区域 */
        .quiz-container {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            background: rgba(6, 16, 10, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(80, 200, 60, 0.4), 0 0 20px rgba(60, 180, 40, 0.2);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 头部 */
        .hero-header {
            text-align: center;
            padding: 1.2rem 1.5rem 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(10, 30, 15, 0.9), rgba(2, 12, 5, 0.95));
            border-bottom: 2px solid #4cbf3a;
            position: relative;
        }
        .hero-header::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6eff4a, #b8ff8c, #6eff4a, transparent);
        }
        .server-tag {
            font-size: 0.85rem;
            color: #a5d6a5;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            font-weight: 500;
            opacity: 0.9;
        }
        .main-title {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e2ffd6, #a5ff7a, #4cbe2a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            text-shadow: 0 0 15px rgba(80, 220, 50, 0.5);
        }
        .subtitle {
            font-size: 1.1rem;
            color: #c0e6b0;
            margin-top: 0.6rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(100, 220, 70, 0.5);

        .progress-bar-bg {

            border-radius: 60px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            box-shadow: inset 0 1px 4px #00000055;
        }
        .progress-fill {
            background: linear-gradient(90deg, #3ba52a, #7eff4a, #3ba52a);
            width: 0%;
            height: 100%;
            border-radius: 60px;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px #5eff40;
        }
        .counter-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            color: #b0d9a0;
            font-weight: 500;
        }

        /* 分页区域 */
        .pages-wrapper {
            position: relative;
            min-height: 460px;
            padding: 0.5rem 2rem 1rem 2rem;
        }
        .question-page {
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .question-page.active-page {
            display: block;
            animation: fadeSlide 0.25s forwards;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateX(18px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-card {
            background: rgba(10, 25, 15, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.8rem 1.5rem;

            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: #eef4e2;
            letter-spacing: -0.2px;
        }
        .q-num-badge {
            display: inline-block;
            background: #2a6b2a;
            border-radius: 60px;
            font-size: 0.75rem;
            padding: 0.2rem 0.9rem;
            margin-bottom: 0.8rem;
            color: #e2ffc7;
            font-weight: 600;
            border: 1px solid #6eff5a;
            box-shadow: 0 0 6px rgba(80, 255, 60, 0.4);

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin: 1.2rem 0 0.8rem;
        }
        .option-label {
            background: rgba(6, 18, 8, 0.8);
            border: 1px solid #3a8a3a;
            border-radius: 60px;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            color: #d4f0c4;
            transition: all 0.2s;
            user-select: none;
            backdrop-filter: blur(2px);
        }
        input[type="radio"] {
            display: none;
        }
        input[type="radio"]:checked + .option-label {
            background: linear-gradient(135deg, #4cbf3a, #2d8a2a);
            border-color: #b5ff8c;
            color: #0f1f0a;
            font-weight: 700;
            box-shadow: 0 0 14px #6aff4a, inset 0 1px 1px rgba(255, 255, 255, 0.3);
            text-shadow: none;
        }
        .option-label:hover {
            background: #2a6b2a;
            border-color: #8eff6e;
            transform: scale(0.97);
            color: #ffffff;
        }

        /* 按钮 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 0.8rem;
            gap: 1rem;
            padding: 0 2rem 1.8rem 2rem;
        }
        .btn {
            background: rgba(20, 35, 22, 0.9);
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #d9f7cf;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            border: 1px solid #3f8a3f;
            flex: 1;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            background: linear-gradient(95deg, #2d7a2a, #1a5518);
            border-color: #6eff5a;
            color: #f0ffe8;
            font-weight: 700;
            box-shadow: 0 0 8px rgba(80, 255, 60, 0.4);
        }
        .btn-primary:hover {
            background: linear-gradient(95deg, #3fa33a, #2a7525);
            transform: scale(0.97);
            cursor: pointer;
            box-shadow: 0 0 14px #6eff5a;
        }
        .btn-secondary:hover {
            background: #2a5a2a;
            border-color: #6eff5a;
            transform: scale(0.97);
        }
        .btn:active {
            transform: scale(0.96);
        }

            padding: 1.5rem 2rem 2rem;
            background: rgba(5, 18, 8, 0.95);
            border-top: 2px solid #4cbf3a;
            width: 100%;

            font-weight: bold;
            text-align: center;
            background: linear-gradient(135deg, #e2ffc7, #a5ff7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.2rem;
            text-shadow: 0 0 10px rgba(80, 255, 60, 0.3);
        }
        .rec-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .rec-item {
            background: #fef9e6;
            border-radius: 1.4rem;
            padding: 1.2rem 1.4rem;
            border-left: 8px solid;
            transition: all 0.2s;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }
        .rec-name {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
            color: #1a2c1a;
        }
        .rec-tag {
            font-size: 0.7rem;
            background: #d4e8c6;
            padding: 3px 10px;
            border-radius: 40px;
            font-weight: 600;
            color: #2a4a1a;
        }
        .rec-reason {
            margin-top: 8px;
            color: #3a5a2a;
            font-size: 0.85rem;
            line-height: 1.45;
            font-weight: 500;
        }
        .footnote {
            text-align: center;
            font-size: 0.75rem;
            margin-top: 1.2rem;
            color: #b0d9a0;
        }
        /* 二维码容器 - 显示在截图底部 */
        .qrcode-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px dashed #4cbf3a;
        }
        .qrcode-container {
            background: white;
            padding: 8px;
            border-radius: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .qrcode-container img {
            width: 70px;
            height: 70px;
        }
        .qrcode-text {
            margin-left: 12px;
            font-size: 0.7rem;
            color: #a5d6a5;
            text-align: left;
            line-height: 1.4;
        }
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .gen-img-btn, .reset-btn {
            flex: 1;
            text-align: center;
            padding: 0.7rem;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .gen-img-btn {
            background: linear-gradient(95deg, #5a3a2a, #3d2a1a);
            border: 1px solid #e0a449;
            color: #ffeaac;
        }
        .reset-btn {
            background: #2a3a1a;
            border: 1px solid #6eff5a;
            color: #e2ffc7;
        }
        .gen-img-btn:hover, .reset-btn:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a1a;
            color: #e2ffc7;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            z-index: 999;
            box-shadow: 0 4px 12px black;
            border-left: 4px solid #6eff5a;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        @media (max-width: 550px) {
            .pages-wrapper {
                padding: 0.5rem 1rem 1rem 1rem;
            }
            .question-card {
                padding: 1.2rem;
            }
            .q-title {
                font-size: 1.2rem;
            }
            .option-label {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            .main-title {
                font-size: 1.5rem;
            }
            .action-buttons {
                flex-direction: column;
            }
            .subtitle {
                font-size: 1rem;
            }
            .qrcode-text {
                font-size: 0.6rem;
            }
        }
    </style>
</head>

        { id: 6, text: "转火能力（快速切目标）", options: ["必须快（灵活性强）", "可以慢一点（不频繁切目标）", "无所谓"], mapKey: "swap", mapping: { "必须快（灵活性强）":"快", "可以慢一点（不频繁切目标）":"可以慢", "无所谓":"可以慢,快" } },
        { id: 7, text: "你对「团队贡献」的态度是？", options: ["我愿意为团队牺牲个人输出/生存", "我可以接受适度的团队要求", "我优先考虑自己玩得爽，团队次要"], mapKey: "teamTend", mapping: { "我愿意为团队牺牲个人输出/生存":"高", "我可以接受适度的团队要求":"中等", "我优先考虑自己玩得爽，团队次要":"低" } },
        { id: 8, text: "更喜欢哪种战斗节奏？", options: ["大秘境（快节奏、频繁AOE）", "团本（站桩、多单体）", "都喜欢"], mapKey: "pace", mapping: { "大秘境（快节奏、频繁AOE）":"大秘境", "团本（站桩、多单体）":"团本", "都喜欢":"都喜欢" } },
        { id: 9, text: "循环倾向", options: ["固定循环（肌肉记忆）", "优先级判断（灵活决策）", "都行"], mapKey: "rotation", mapping: { "固定循环（肌肉记忆）":"固定", "优先级判断（灵活决策）":"优先级", "都行":"固定,优先级" } }
    ];

    let userAnswers = new Array(questions.length).fill(null);
    let currentPage = 0;
    let quizSubmitted = false;
    let autoJump = null;

    const pagesContainer = document.getElementById("pagesContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressFill = document.getElementById("progressFill");
    const currentIdxDisplay = document.getElementById("currentIdxDisplay");
    const totalCountDisplay = document.getElementById("totalCountDisplay");
    const navArea = document.getElementById("navButtonsArea");
    const resultAreaDiv = document.getElementById("resultArea");
    totalCountDisplay.innerText = `/ ${questions.length}题`;

    function showToast(msg) {
        const toast = document.getElementById("toastMsg");
        toast.innerText = msg;
        toast.style.opacity = "1";
        setTimeout(() => toast.style.opacity = "0", 2500);
    }

    // 匹配逻辑
    function isSpecMatch(spec, qDef, userChoice) {
        if(!userChoice) return false;
        let requiredRaw = qDef.mapping ? qDef.mapping[userChoice] : userChoice;
        if(!requiredRaw) return false;
        const specVal = spec[qDef.mapKey];
        if(!specVal) return false;
        let requiredTags = requiredRaw.split(',');
        let specTags = specVal.split(',');
        for(let req of requiredTags) if(specTags.includes(req.trim())) return true;
        if(qDef.id === 6 && userChoice === "无所谓") return true;
        if(qDef.id === 2 && userChoice === "我就喜欢极难的！" && specVal === "极难") return true;
        if(qDef.id === 1) {
            if(requiredRaw === "无" && specVal === "无") return true;
            if(requiredRaw === "少,极少" && (specVal === "少" || specVal === "极少" || specVal === "无")) return true;
            if(requiredRaw === "较多,很多" && (specVal === "较多" || specVal === "很多")) return true;
        }
        return false;
    }

    function computeTopSpecs(answersObj) {
        let scores = [];
        for(let spec of specsData) {
            let matchCount = 0, totalValid = 0;
            for(let q of questions) {
                const choice = answersObj[q.id];
                if(!choice) continue;
                totalValid++;
                if(isSpecMatch(spec, q, choice)) matchCount++;
            }
            let ratio = totalValid ? matchCount/totalValid : 0;
            const teamAns = answersObj[7];
            let bonus = 0;
            if(teamAns === "我愿意为团队牺牲个人输出/生存" && spec.teamTend === "高") bonus = 0.07;
            else if(teamAns === "我优先考虑自己玩得爽，团队次要" && spec.teamTend === "低") bonus = 0.06;
            else if(teamAns === "我可以接受适度的团队要求" && spec.teamTend === "中等") bonus = 0.05;
            scores.push({ spec, score: ratio+bonus });
        }
        scores.sort((a,b)=>b.score-a.score);
        return scores.slice(0,3);
    }

    // 推荐理由生成函数
    function generateReason(spec, answers) {
        let parts = [];
        if(answers[0] && spec.range === answers[0]) {
            parts.push(`偏好${answers[0]}战斗`);
        }
        const teamAns = answers[7];
        if(teamAns === "我愿意为团队牺牲个人输出/生存" && spec.teamTend === "高") {
            parts.push("团队之盾");
        } else if(teamAns === "我优先考虑自己玩得爽，团队次要" && spec.teamTend === "低") {
            parts.push("独狼之魂");
        } else if(teamAns === "我可以接受适度的团队要求" && spec.teamTend === "中等") {
            parts.push("团队与自我平衡");
        }
        if(parts.length === 0) {
            parts.push("战斗直觉共鸣");
        }
        return parts.join(" · ");
    }

    // 截图分享：截取整个卡片 .quiz-container，二维码已在结果区内
    async function captureFullCard() {
        const cardElement = document.querySelector('.quiz-container');
        if (!cardElement) {
            showToast("未找到截图区域");
            return;
        }
        try {
            showToast("正在生成图片，请稍等...");
            const originalWidth = cardElement.style.width;
            cardElement.style.width = "600px";
            await new Promise(r => setTimeout(r, 150));
            const canvas = await html2canvas(cardElement, {
                scale: 2.8,
                backgroundColor: '#051a0c',
                logging: false,
                useCORS: false,
                windowWidth: cardElement.scrollWidth,
                windowHeight: cardElement.scrollHeight
            });
            cardElement.style.width = originalWidth;
            const imgData = canvas.toDataURL('image/png');
            const newWin = window.open();
            if (newWin) {
                newWin.document.write(`
                    <html><head><title>瑶服 · 本命专精分享图</title>
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>body { margin:0; display:flex; justify-content:center; align-items:center; background:#0a0c15; min-height:100vh; } img { max-width:100%; height:auto; box-shadow:0 0 20px rgba(0,0,0,0.5); }</style>
                    </head><body><img src="${imgData}" /></body></html>
                `);
                showToast("图片已生成，长按保存即可分享");
            } else {
                const downloadLink = document.createElement('a');
                downloadLink.href = imgData;
                downloadLink.download = `yaofu_spec_${Date.now()}.png`;
                downloadLink.click();
                showToast("图片已生成，请查看下载文件");
            }
        } catch (err) {
            console.error(err);
            showToast("生成失败，可尝试刷新后重试");
        }
    }

    // 渲染结果（底部加入二维码）
    function displayResults(topThree, answerMap) {
        const borderColors = ["#3ba52a", "#5fbf3a", "#2d8a2a"];
        let recHtml = `<div class="result-area">
            <div class="result-title">⚔️ 你的本命专精是：</div>
            <div class="rec-list">`;
        topThree.forEach((item, idx) => {
            const spec = item.spec;
            const reason = generateReason(spec, answerMap);
            let castDesc = "瞬发";
            if(spec.cast === "少") castDesc = "少量读条";
            else if(spec.cast === "较多" || spec.cast === "很多") castDesc = "读条核心";
            const tag = `${spec.range} · ${castDesc} · ${spec.difficulty}`;
            recHtml += `<div class="rec-item" style="border-left-color: ${borderColors[idx]};">
                <div class="rec-name">✨ ${spec.name} <span class="rec-tag">${tag}</span></div>
                <div class="rec-reason">${reason}</div>
                <div class="rec-reason" style="margin-top: 5px; font-size:0.75rem;">🎲 根据你的选择深度匹配</div>
            </div>`;
        });
        recHtml += `</div><div class="footnote">※ 推荐基于操作风格、团队态度与战斗偏好，并非强度排名。<br>瑶服与你同行 Q群722409645</div>
        <div class="qrcode-section">
            <div class="qrcode-container" id="qrcodeImg"></div>
            <div class="qrcode-text">扫码立即测试<br>你的本命专精</div>
        </div>
        <div class="action-buttons">
            <button class="gen-img-btn" id="genPosterBtn">📸 生成结果图片</button>
            <button class="reset-btn" id="resetQuizBtn">🔄 重新测试</button>
        </div></div>`;
        resultAreaDiv.innerHTML = recHtml;
        resultAreaDiv.style.display = "block";
        
        // 生成二维码
        const qrContainer = document.getElementById("qrcodeImg");
        if (qrContainer) {
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: "https://wowyao.github.io/yaoguangwowdps/",
                width: 70,
                height: 70,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }
        
        document.getElementById("genPosterBtn")?.addEventListener("click", captureFullCard);
        document.getElementById("resetQuizBtn")?.addEventListener("click", () => {
            userAnswers.fill(null);
            currentPage = 0;
            quizSubmitted = false;
            resultAreaDiv.style.display = "none";
            document.getElementById("progressArea").style.display = "block";
            pagesContainer.style.display = "block";
            navArea.style.display = "flex";
            buildPages();
            if(autoJump) clearTimeout(autoJump);
            window.scrollTo({ top: 0 });
        });
    }

    // 构建分页
    function buildPages() {
        pagesContainer.innerHTML = "";
        questions.forEach((q, idx) => {
            const pageDiv = document.createElement("div");
            pageDiv.className = "question-page";
            pageDiv.setAttribute("data-page-idx", idx);
            let optsHtml = `<div class="question-card"><div class="q-num-badge">问题 ${idx+1} / ${questions.length}</div><div class="q-title">${q.text}</div><div class="options">`;
            q.options.forEach(opt => {
                const rid = `q_${idx}_${opt.replace(/\s/g, '')}_${Math.random()}`;
                optsHtml += `<input type="radio" name="page_${idx}" value="${opt}" id="${rid}"><label for="${rid}" class="option-label">${opt}</label>`;
            });
            optsHtml += `</div></div>`;
            pageDiv.innerHTML = optsHtml;
            pagesContainer.appendChild(pageDiv);
            if(userAnswers[idx]) { const radio = pageDiv.querySelector(`input[value="${userAnswers[idx]}"]`); if(radio) radio.checked = true; }
            pageDiv.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    userAnswers[idx] = e.target.value;
                    updateProgressAndButtons();
                    if(autoJump) clearTimeout(autoJump);
                    autoJump = setTimeout(() => {
                        if(!quizSubmitted && idx === currentPage) {
                            if(currentPage === questions.length-1) {
                                if(userAnswers.every(a=>a!==null)) computeAndShowResults();
                            } else if(currentPage+1 < questions.length) goToPage(currentPage+1);
                        }
                    }, 280);
                });
            });
        });
        updatePageVisibility();
    }

    function goToPage(p) { if(quizSubmitted) return; if(p>=0 && p<questions.length) { currentPage=p; updatePageVisibility(); } }
    function updatePageVisibility() { document.querySelectorAll('.question-page').forEach((pg,i)=> i===currentPage? pg.classList.add('active-page'): pg.classList.remove('active-page')); currentIdxDisplay.innerText = `第${currentPage+1}题`; updateProgressAndButtons(); }
    function updateProgressAndButtons() { const answered = userAnswers.filter(a=>a!==null).length; progressFill.style.width = `${(answered/questions.length)*100}%`; if(currentPage===questions.length-1) nextBtn.innerText = "✨ 完成并推荐 ✨"; else nextBtn.innerText = "下一题 ▶"; }
    function goPrev() { if(currentPage>0) goToPage(currentPage-1); }
    function goNextOrSubmit() { if(quizSubmitted) return; if(!userAnswers[currentPage]) { alert("请先回答本题"); return; } if(currentPage===questions.length-1) { if(userAnswers.every(a=>a!==null)) computeAndShowResults(); } else goToPage(currentPage+1); }
    function computeAndShowResults() { if(quizSubmitted) return; let ansMap={}; userAnswers.forEach((v,i)=>ansMap[i]=v); const topThree = computeTopSpecs(ansMap); document.getElementById("progressArea").style.display="none"; pagesContainer.style.display="none"; navArea.style.display="none"; displayResults(topThree, ansMap); quizSubmitted=true; }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNextOrSubmit);
    buildPages();
</script>
</body>
</html>
